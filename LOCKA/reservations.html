<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حجوزاتي - LOCKA</title><style> :root{--navy:#2E5B9A;--blue:#5B8FD9;--pale:#F5F8FF;--line:#A7C8F0}*{box-sizing:border-box}body{margin:0;background:var(--pale);font-family:Tahoma,Arial,sans-serif;color:#26364b;direction:rtl}.site-head{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;padding:12px 5%;box-shadow:0 2px 10px #2e5b9a12}.site-head img{height:56px;max-width:145px;object-fit:contain}.site-head a,.btn{color:var(--navy);text-decoration:none}.wrap{width:min(920px,92%);margin:28px auto}.panel{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #2e5b9a12}.btn,button{display:inline-block;border:0;border-radius:10px;padding:12px 18px;background:var(--navy);color:white;font-size:15px;cursor:pointer;text-decoration:none}.btn.alt{background:white;color:var(--navy);border:1px solid var(--line)}input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}label{font-weight:bold;color:var(--navy)}h1,h2{color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.muted{color:#65758b;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}@media(max-width:560px){.site-head{padding:10px 4%}.site-head img{height:45px}.panel{padding:16px}.wrap{margin:16px auto}}</style></head><body><header class="site-head"><a href="profile.html" aria-label="العودة إلى الملف الشخصي">‹ الرجوع إلى الملف الشخصي</a><img src="Logig and/logo.png" alt="LOCKA"><strong>reservations</strong></header><div class="wrap"><h1>حجوزاتي</h1><section class="panel"><h2>الحجوزات الحالية</h2><div id="current"></div></section><section class="panel"><h2>الحجوزات السابقة</h2><div id="previous"></div></section></div><script src="locka.js"></script><script>
(()=>{const b=LOCKA.get('lockaBooking');const c=document.getElementById('current'),p=document.getElementById('previous');
if(!b||b.status==='cancelled'){c.innerHTML='<p>لا توجد حجوزات حالية. بعد إتمام الدفع سيظهر حجزك هنا.</p><a class="btn" href="Booking Details/index.html">احجزي الآن</a>';return}
const start=b.startAt?new Date(b.startAt):null,end=b.endAt?new Date(b.endAt):null;const active=end&&end.getTime()>Date.now();const target=active?c:p;
const safe=v=>String(v??'—').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const ref=b.bookingRef||('LCK-'+String(b.createdAt||Date.now()).replace(/\D/g,'').slice(-6));const pin=b.pin||'يظهر بعد تأكيد الدفع';
target.innerHTML=`<article class="booking-card"><h3>حجز ${safe(ref)}</h3><p><strong>المبنى:</strong> ${safe(b.building)}</p><p><strong>الدور:</strong> ${safe(b.floor)}</p><p><strong>اللوكر:</strong> ${safe(b.locker)}</p><p><strong>تاريخ ووقت البداية:</strong> ${start?start.toLocaleString('ar-SA'):'—'}</p><p><strong>تاريخ ووقت النهاية:</strong> ${end?end.toLocaleString('ar-SA'):'—'}</p><p><strong>الرمز السري:</strong> <span style="font-size:20px;font-weight:bold;letter-spacing:3px">${safe(pin)}</span></p><div style="display:grid;place-items:center;margin:18px auto;padding:12px;background:white;border:1px solid #dce7f5;border-radius:12px;max-width:190px"><svg id="bookingQR" width="140" height="140" viewBox="0 0 21 21" role="img" aria-label="رمز QR للحجز"></svg><small>رمز الحجز ${safe(ref)}</small></div><div class="row"><a class="btn" href="booking-confirmation.html">تفاصيل الحجز</a><a class="btn alt" href="Booking Management/LOCKA_ادارة_الحجز/manage-booking.html">إدارة الحجز</a><a class="btn alt" href="home Screen/select-building.html">حجز جديد</a></div></article>`;
// Render a compact local visual code from the reservation reference (not a payment/access credential).
const svg=target.querySelector('#bookingQR');if(svg){let seed=Array.from(ref+pin).reduce((a,ch)=>((a*31)+ch.charCodeAt(0))>>>0,7);let bits='';for(let i=0;i<441;i++){seed=(seed*1664525+1013904223)>>>0;let x=i%21,y=Math.floor(i/21);let finder=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);let on=finder?((x%14<7&&y%14<7)&&((x%14===0||x%14===6||y%14===0||y%14===6)||(x%14>=2&&x%14<=4&&y%14>=2&&y%14<=4))):((seed>>>29)&1);if(on)bits+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#244A7C"/>`}svg.innerHTML=bits}
if(!active&&p===target){c.innerHTML='<p>لا توجد حجوزات حالية.</p>'}
})();</script></body></html>
