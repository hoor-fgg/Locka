<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKA</title>
    <link rel="stylesheet" href="style.css?v=111">
</head>
<body>

    <div class="app-container">
        <!-- 1. الهيدر: اللوقو والترحيب يمين، والشرطات يسار -->
        <div class="header-container">
            <!-- الجهة اليمنى: اللوقو النصي/الصورة والترحيب -->
            <div class="header-right">
                <img src="logo.png" alt="LOCKA" class="app-logo">
                <div class="welcome-text">
                    <h1 class="welcome-title">مرحباً، </h1>
                   
                </div>
            </div>

            <!-- الجهة اليسرى: زر الشرطات الثلاث فقط -->
            <div class="header-left">
                <button class="menu-btn" id="open-btn" aria-label="فتح القائمة">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>

        <!-- 2. شريط البحث -->
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="ابحث عن خزانة أو مبنى...">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>

        <!-- 3. شبكة الأزرار الرئيسية -->
        <div class="grid-menu">
            <a href="select-building.html" class="card">
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                حجز خزانة
            </a>
            <a href="../Location/ashwag locka.html. .html" class="card">
                <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                    <line x1="8" y1="2" x2="8" y2="18"></line>
                    <line x1="16" y1="6" x2="16" y2="22"></line>
                </svg>
                عرض الخريطة
            </a>
        </div>

        <!-- 4. حجوزاتي القادمة -->
        <h2 class="section-title">حجوزاتي القادمة</h2>
        <div class="booking-card" id="upcomingBooking">
            <div class="booking-details">
                <p><strong>المبنى:</strong> الكلية العلمية بالرس</p>
                <p><strong>الخزانة:</strong> 12</p>
                <div class="booking-date">من 10:00 ص إلى 12:00 م (2026/10/4)</div>
            </div>
            <div class="booking-left">
                <span class="badge-active">نشط</span>
            </div>
        </div>
    </div>

    <!-- 5. القائمة الجانبية -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
         
            <button id="close-sidebar" class="close-btn">&times;</button>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a href="index.html" class="active">
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    الرئيسية
                </a>
            </li>
            <li>
                <a href="../reservations.html">
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    حجوزاتي
                </a>
            </li>
            <li>
                <a href="../notifications.html">
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    التنبيهات
                </a>
            </li>
            <li>
                <a href="../profile.html">
                    <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    حسابي
                </a>
            </li>
        </ul>
    </div>

    <!-- خلفية التظليل -->
    <div id="overlay" class="overlay"></div>

    <script src="../locka.js"></script><script>
        const openBtn = document.getElementById('open-btn');
        const closeBtn = document.getElementById('close-sidebar');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        openBtn.addEventListener('click', () => {
            sidebar.classList.add('open');
            overlay.classList.add('show');
        });

        function closeMenu() {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }

        closeBtn.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);
    </script>
<script>const b=LOCKA.get('lockaBooking');const card=document.getElementById('upcomingBooking');if(card){if(!b||b.status==='cancelled')card.innerHTML='<p>لا توجد حجوزات قادمة حتى الآن.</p>';else card.innerHTML='<div class="booking-details"><p><strong>المبنى:</strong> '+(b.building||'—')+'</p><p><strong>الدور:</strong> '+(b.floor||'—')+'</p><p><strong>الخزانة:</strong> '+(b.locker||'—')+'</p><div class="booking-date">'+(b.startAt?new Date(b.startAt).toLocaleString('ar-SA'):'—')+' إلى '+(b.endAt?new Date(b.endAt).toLocaleString('ar-SA'):'—')+'</div></div><div class="booking-left"><a href="../reservations.html">عرض الحجز</a></div>'}const u=LOCKA.get('lockaUser');const wt=document.querySelector('.welcome-title');if(u&&wt)wt.textContent='مرحباً، '+u.name;</script></body>
</html>
