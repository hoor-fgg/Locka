<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإعدادات - LOCKA</title><style> :root{--navy:#2E5B9A;--blue:#5B8FD9;--pale:#F5F8FF;--line:#A7C8F0}*{box-sizing:border-box}body{margin:0;background:var(--pale);font-family:Tahoma,Arial,sans-serif;color:#26364b;direction:rtl}.site-head{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;padding:12px 5%;box-shadow:0 2px 10px #2e5b9a12}.site-head img{height:56px;max-width:145px;object-fit:contain}.site-head a,.btn{color:var(--navy);text-decoration:none}.wrap{width:min(920px,92%);margin:28px auto}.panel{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #2e5b9a12}.btn,button{display:inline-block;border:0;border-radius:10px;padding:12px 18px;background:var(--navy);color:white;font-size:15px;cursor:pointer;text-decoration:none}.btn.alt{background:white;color:var(--navy);border:1px solid var(--line)}input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}label{font-weight:bold;color:var(--navy)}h1,h2{color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.muted{color:#65758b;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}@media(max-width:560px){.site-head{padding:10px 4%}.site-head img{height:45px}.panel{padding:16px}.wrap{margin:16px auto}}</style></head><body><header class="site-head"><a href="profile.html" aria-label="العودة إلى الملف الشخصي">‹ الرجوع إلى الملف الشخصي</a><img src="Logig and/logo.png" alt="LOCKA"><strong>settings</strong></header><div class="wrap"><section class="panel"><h1>الإعدادات</h1><label for="language">اللغة</label><select id="language"><option value="ar">العربية</option><option value="en">English</option></select><button id="save">حفظ الإعدادات</button><p id="msg" class="muted"></p></section></div><script src="locka.js"></script><script>const lang=document.getElementById('language');lang.value=LOCKA.get('lockaSettings',{language:'ar'}).language;document.getElementById('save').onclick=()=>{LOCKA.set('lockaSettings',{language:lang.value});document.getElementById('msg').textContent='تم حفظ الإعدادات على هذا الجهاز.'}</script></body></html>
