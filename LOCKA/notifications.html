<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التنبيهات - LOCKA</title><style> :root{--navy:#2E5B9A;--blue:#5B8FD9;--pale:#F5F8FF;--line:#A7C8F0}*{box-sizing:border-box}body{margin:0;background:var(--pale);font-family:Tahoma,Arial,sans-serif;color:#26364b;direction:rtl}.site-head{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;padding:12px 5%;box-shadow:0 2px 10px #2e5b9a12}.site-head img{height:56px;max-width:145px;object-fit:contain}.site-head a,.btn{color:var(--navy);text-decoration:none}.wrap{width:min(920px,92%);margin:28px auto}.panel{background:white;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 5px 20px #2e5b9a12}.btn,button{display:inline-block;border:0;border-radius:10px;padding:12px 18px;background:var(--navy);color:white;font-size:15px;cursor:pointer;text-decoration:none}.btn.alt{background:white;color:var(--navy);border:1px solid var(--line)}input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}label{font-weight:bold;color:var(--navy)}h1,h2{color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.muted{color:#65758b;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}@media(max-width:560px){.site-head{padding:10px 4%}.site-head img{height:45px}.panel{padding:16px}.wrap{margin:16px auto}}</style></head><body><header class="site-head"><a href="home Screen/index.html" aria-label="رجوع">‹ رجوع</a><img src="Logig and/logo.png" alt="LOCKA"><strong>notifications</strong></header><div class="wrap"><section class="panel"><h1>التنبيهات</h1><p class="muted">تُعرض التنبيهات حسب وقت الحجز المحفوظ على هذا الجهاز.</p><button id="enablePush" type="button">تفعيل إشعارات المتصفح</button><p class="muted" id="pushStatus"></p><div id="notices"></div></section></div><script src="locka.js"></script><script>
(()=>{const box=document.getElementById('notices'),push=document.getElementById('enablePush'),status=document.getElementById('pushStatus');
const render=()=>{const b=LOCKA.get('lockaBooking'),saved=LOCKA.get('lockaNotifications',[]),now=Date.now();let upcoming=[];
if(b&&b.status!=='cancelled'&&b.startAt&&b.endAt){const ref=b.bookingRef||b.createdAt||`${b.startAt}_${b.locker||''}`,s=new Date(b.startAt).getTime(),e=new Date(b.endAt).getTime();upcoming=[{id:`${ref}:before-start`,at:s-300000,title:'قبل بدء الحجز',message:'سيبدأ حجزك خلال 5 دقائق.'},{id:`${ref}:before-end`,at:e-1800000,title:'قبل انتهاء الحجز بـ30 دقيقة',message:'باقي 30 دقيقة على انتهاء الحجز.'},{id:`${ref}:ended`,at:e,title:'انتهاء الحجز',message:'انتهى وقت الحجز.'}].filter(n=>n.at>now&&!saved.some(x=>x.id===n.id));}
const all=[...saved.map(n=>({...n,when:new Date(n.createdAt||n.at)})),...upcoming.map(n=>({...n,when:new Date(n.at),upcoming:true}))].sort((a,b)=>b.when-a.when);
box.innerHTML=all.length?all.map(n=>`<article class="panel"><h3>${n.title}</h3><p>${n.message}</p><small>${n.upcoming?'موعد التنبيه: ':'وقت التنبيه: '}${n.when.toLocaleString('ar-SA')}</small></article>`).join(''):'<p>لا توجد تنبيهات مسجلة أو مواعيد قادمة. تأكدي من وجود حجز مؤكد.</p>';};
push.addEventListener('click',async()=>{if(!('Notification' in window)){status.textContent='المتصفح لا يدعم إشعارات النظام؛ ستظهر التنبيهات داخل صفحة التنبيهات.';return}try{const permission=await Notification.requestPermission();status.textContent=permission==='granted'?'تم تفعيل إشعارات المتصفح. اتركي الموقع مفتوحًا ليتمكن من تنبيهك في المواعيد.':'لم يتم السماح بإشعارات المتصفح؛ ستظهر التنبيهات داخل الموقع عند فتحه.';}catch(_){status.textContent='تعذر تفعيل إشعارات المتصفح في هذا السياق.'}});
if('Notification' in window) status.textContent=Notification.permission==='granted'?'إشعارات المتصفح مفعلة.':'يمكن تفعيل إشعارات المتصفح من الزر؛ يلزم إبقاء الموقع مفتوحًا.';
window.addEventListener('locka:notification',render);window.addEventListener('storage',render);render();})();</script></body></html>
