<script src="../locka.js"></script><script>

const selectedLocker =
    localStorage.getItem("selectedLocker");

const lockerNumber =
    document.getElementById("lockerNumber");


if (selectedLocker) {

    lockerNumber.textContent =
        selectedLocker;

} else {

    lockerNumber.textContent =
        "غير محدد";

}


const startDate =
    document.getElementById("startDate");

const endDate =
    document.getElementById("endDate");

const startTime =
    document.getElementById("startTime");

const endTime =
    document.getElementById("endTime");

const durationText =
    document.getElementById("durationText");


const today =
    new Date();


function formatDate(date) {

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(date.getDate())
        .padStart(2, "0");

    return year + "-" +
        month + "-" +
        day;
}


function addOneMonth(dateString) {

    const parts =
        dateString.split("-");

    const year =
        Number(parts[0]);

    const month =
        Number(parts[1]);

    const day =
        Number(parts[2]);

    const lastDayNextMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();

    const finalDay =
        Math.min(
            day,
            lastDayNextMonth
        );

    return year +
        "-" +
        String(month + 1).padStart(2, "0") +
        "-" +
        String(finalDay).padStart(2, "0");
}


startDate.min =
    formatDate(today);

startDate.value =
    formatDate(today);

startTime.value =
    "08:00";

endTime.value =
    "09:00";


function updateEndDate() {

    if (!startDate.value) {
        return;
    }

    endDate.min =
        startDate.value;

    endDate.max =
        addOneMonth(
            startDate.value
        );

    if (
        !endDate.value ||
        endDate.value < endDate.min ||
        endDate.value > endDate.max
    ) {

        endDate.value =
            startDate.value;

    }

    calculateDuration();
}


function calculateDuration() {

    if (
        !startDate.value ||
        !endDate.value ||
        !startTime.value ||
        !endTime.value
    ) {

        durationText.textContent =
            "—";

        return;
    }

    const start =
        new Date(
            startDate.value +
            "T" +
            startTime.value
        );

    const end =
        new Date(
            endDate.value +
            "T" +
            endTime.value
        );

    const difference =
        end - start;


    if (difference <= 0) {

        durationText.textContent =
            "تحققي من التاريخ والوقت";

        return;
    }


    const totalHours =
        Math.round(
            difference / 3600000
        );

    const days =
        Math.floor(
            totalHours / 24
        );

    const hours =
        totalHours % 24;


    if (days > 0 && hours > 0) {

        durationText.textContent =
            days +
            " يوم و " +
            hours +
            " ساعة";

    }

    else if (days > 0) {

        durationText.textContent =
            days +
            " يوم";

    }

    else {

        durationText.textContent =
            hours +
            " ساعة";

    }

}


startDate.addEventListener(
    "change",
    updateEndDate
);

endDate.addEventListener(
    "change",
    calculateDuration
);

startTime.addEventListener(
    "change",
    calculateDuration
);

endTime.addEventListener(
    "change",
    calculateDuration
);


updateEndDate();


document
    .getElementById("confirmButton")
    .addEventListener(
        "click",
        function() {

            if (!selectedLocker) {

                alert(
                    "فضلاً ارجعي للصفحة الرئيسية واختاري خزانة متاحة أولاً."
                );

                return;
            }


            if (
                !startDate.value ||
                !endDate.value ||
                !startTime.value ||
                !endTime.value
            ) {

                alert(
                    "فضلاً أدخلي جميع تفاصيل الحجز."
                );

                return;
            }


            const maximumDate =
                addOneMonth(
                    startDate.value
                );


            if (
                endDate.value >
                maximumDate
            ) {

                alert(
                    "أقصى مدة للحجز هي شهر واحد."
                );

                return;
            }


            const start =
                new Date(
                    startDate.value +
                    "T" +
                    startTime.value
                );


            const end =
                new Date(
                    endDate.value +
                    "T" +
                    endTime.value
                );


            if (end <= start) {

                alert(
                    "وقت النهاية يجب أن يكون بعد وقت البداية."
                );

                return;
            }


            // ينتقل حفظ الحجز والدفع عبر معالج الربط أسفل الصفحة.

        }
    );


const menuButton =
    document.getElementById("menuButton");

const menuDropdown =
    document.getElementById("menuDropdown");


menuButton.addEventListener(
    "click",
    function() {

        menuDropdown.classList.toggle("open");

    }
);

</script>

<script>(()=>{const sel=LOCKA.get('lockaSelection',{});const locker=localStorage.getItem('selectedLocker')||sel.locker||'';const ln=document.getElementById('lockerNumber');if(ln)ln.textContent=locker||'—';const btn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('تأكيد الحجز'));if(!btn)return;btn.onclick=null;btn.addEventListener('click',ev=>{ev.preventDefault();const sd=document.getElementById('startDate')?.value,st=document.getElementById('startTime')?.value,ed=document.getElementById('endDate')?.value,et=document.getElementById('endTime')?.value;if(!sel.building||!sel.floor||!locker){alert('ارجعي لاختيار المبنى والدور واللوكر.');return}if(!sd||!st||!ed||!et){alert('أكملي تاريخ ووقت البداية والنهاية.');return}const startAt=new Date(sd+'T'+st),endAt=new Date(ed+'T'+et);if(endAt<=startAt){alert('وقت النهاية يجب أن يكون بعد وقت البداية.');return}const mins=Math.round((endAt-startAt)/60000);if(mins>31*24*60){alert('مدة الحجز تتجاوز الحد المسموح.');return}const days=mins/1440;let total;if(mins<=60)total=3;else if(days<=1)total=5;else if(days<=7)total=25;else if(days<=15)total=50;else if(days<=30)total=100;else{alert('مدة الحجز لا تتجاوز شهرًا واحدًا.');return;}const b={building:sel.building,floor:sel.floor,locker:String(locker),startAt:startAt.toISOString(),endAt:endAt.toISOString(),durationMinutes:mins,total:total,status:'pending',createdAt:new Date().toISOString()};LOCKA.set('lockaBooking',b);LOCKA.set('lockaPendingPayment',{...b,purpose:'booking'});location.href='../payment method/index.html'});})();</script></body>
