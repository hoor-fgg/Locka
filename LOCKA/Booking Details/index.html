            <button class="locker reserved" disabled>13</button>

            <h3 id="selectedText">
                هل تريد حجز خزانة؟
            </h3>

                ثم انتقل إلى تفاصيل الحجز.
            </p>

            <a href="booking-details.html"
               class="main-button"
               id="continueButton">

                الانتقال إلى تفاصيل الحجز

            </a>

        </div>

    </main>

</div>


<script src="../locka.js"></script><script>

const buildingName =
    localStorage.getItem("buildingName");

const floorName =
    localStorage.getItem("floorName");


if (buildingName) {

    document.getElementById("buildingName").textContent =
        buildingName;

}


if (floorName) {

    document.getElementById("floorName").textContent =
        floorName;

}


const lockers =
    document.querySelectorAll(".locker.available");


const selectedText =
    document.getElementById("selectedText");


const bookingHint =
    document.getElementById("bookingHint");


const continueButton =
    document.getElementById("continueButton");


lockers.forEach(function(locker) {

    locker.addEventListener("click", function() {

        lockers.forEach(function(item) {

            item.classList.remove("selected");

        });


        locker.classList.add("selected");


        const lockerNumber =
            locker.getAttribute("data-locker");


        localStorage.setItem(
            "selectedLocker",
            lockerNumber
        );


        selectedText.textContent =
            "تم اختيار الخزانة رقم " +
            lockerNumber;


        bookingHint.textContent =
            "يمكنك الآن الانتقال إلى تفاصيل الحجز واختيار التاريخ والوقت.";

    });

});


continueButton.addEventListener(
    "click",
    function(event) {

        const selectedLocker =
            localStorage.getItem("selectedLocker");


        if (!selectedLocker) {

            event.preventDefault();


            alert(
                "فضلاً اختاري خزانة متاحة أولاً."
            );

        }

    }
);


const menuButton =
    document.getElementById("menuButton");


const menuDropdown =
    document.getElementById("menuDropdown");


menuButton.addEventListener(
    "click",
    function() {

        menuDropdown.classList.toggle("open");

    }
);

</script>


<script>document.querySelectorAll('.locker.available[data-locker]').forEach(btn=>btn.addEventListener('click',()=>{const sel=LOCKA.get('lockaSelection',{});LOCKA.set('lockaSelection',{...sel,locker:btn.dataset.locker});location.href='booking-details.html'}));const sel=LOCKA.get('lockaSelection',{});const heading=document.querySelector('h1');if(heading&&sel.building)heading.title=sel.building+' - '+(sel.floor||'');</script></body>

</html>
