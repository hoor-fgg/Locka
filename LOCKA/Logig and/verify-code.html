<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locka - رمز التحقق</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Locka Logo" class="project-logo">
        
        <h2>  (OTP)</h2>
        <p>أدخل الرمز المكون من 4 أرقام المرسل لرقم جوالك</p>
        
        <form action="login.html">
            <div class="form-group">
                <i class="fa-solid fa-shield-halved input-icon"></i>
                <input type="text" required placeholder="أدخل رمز التحقق " maxlength="4" style="text-align: center; letter-spacing: 4px; font-size: 1.1rem; padding-right: 12px;">
            </div>
            
            <button type="submit" class="btn" style="margin-top: 15px;">تحقق </button>
        </form>

        <div class="links" style="margin-top: 20px;">
            <a href="forget-password.html"> تغيير رقم الجوال</a>
        </div>
    </div>

</body>
</html>
