<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locka - إنشاء حساب</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Locka Logo" class="project-logo">
        
        <h2>حساب جديد</h2>
        <p>قم بإنشاء حسابك للبدء بالحجز</p>
        
        <form id="registerForm">
            <div class="form-group">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" required placeholder="أدخل اسمك الكامل">
            </div>

            <div class="form-group">
                <i class="fa-solid fa-id-card input-icon"></i>
                <input type="text" required placeholder="أدخل رقمك الجامعي">
            </div>

            <div class="form-group">
                <i class="fa-solid fa-phone input-icon"></i>
                <input type="tel" required placeholder="أدخل رقم الجوال (05xxxxxxxx)" dir="ltr" style="text-align: right;">
            </div>
            
            <div class="form-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" required placeholder="أدخل كلمة المرور الجديدة">
            </div>
            
            <button type="submit" class="btn" style="margin-top: 15px;">إنشاء الحساب</button>
        </form>

        <div class="links">
            <a href="login.html">لديك حساب بالفعل؟ سجل دخولك</a>
        </div>
    </div>

<script>document.getElementById('registerForm').addEventListener('submit',e=>{e.preventDefault();const i=e.currentTarget.querySelectorAll('input');if(!i[0].value.trim()||!i[1].value.trim()||!i[2].value.trim()||!i[3].value){alert('أكملي جميع البيانات');return}localStorage.setItem('lockaUser',JSON.stringify({name:i[0].value.trim(),studentId:i[1].value.trim(),phone:i[2].value.trim()}));alert('تم إنشاء الحساب على هذا الجهاز.');location.href='../home Screen/index.html'});</script></body>
</html>
