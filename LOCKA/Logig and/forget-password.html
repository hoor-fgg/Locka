<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locka - استعادة كلمة المرور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Locka Logo" class="project-logo">
        
        <h2>استعادة كلمة المرور</h2>
        <p>أدخل رقم الجوال المسجل للمتابعة</p>
        
        <form action="verify-code.html">
            <div class="form-group">
                <i class="fa-solid fa-phone input-icon"></i>
                <input type="tel" required placeholder="أدخل رقم الجوال (05xxxxxxxx)" dir="ltr" style="text-align: right;">
            </div>
            
            <button type="submit" class="btn" style="margin-top: 15px;">التالي </button>
        </form>

        <div class="links" style="margin-top: 20px;">
            <a href="login.html"> العودة لتسجيل الدخول</a>
        </div>
    </div>

</body>
</html>
